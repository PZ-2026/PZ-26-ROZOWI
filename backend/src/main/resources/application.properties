spring.application.name=blokur

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA - Flyway zarzadza schematem, Hibernate nie powinien modyfikowac
spring.jpa.hibernate.ddl-auto=none

# Katalog zapisu przesyłanych plików (np. loga nieruchomości)
app.upload.dir=${UPLOAD_DIR:uploads}

# Storage dokumentów: local (dysk) lub s3 (AWS — stub w S3DocumentStorage)
storage.type=${STORAGE_TYPE:local}
storage.s3.bucket=${STORAGE_S3_BUCKET:}
storage.s3.region=${STORAGE_S3_REGION:}

# SLA — godziny robocze (pon–pt), konfigurowalne przez zmienne środowiskowe
sla.work-start=${SLA_WORK_START:8}
sla.work-end=${SLA_WORK_END:16}

# Firebase Cloud Messaging — ścieżka do pliku klucza serwisowego
fcm.credentials.path=${FCM_CREDENTIALS_PATH:}
