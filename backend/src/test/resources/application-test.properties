# Konfiguracja H2 dla testów w trybie kompatybilności z PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=TYPE;INIT=CREATE ALIAS IF NOT EXISTS \"uuid_generate_v4\" FOR \"java.util.UUID.randomUUID\"
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway - wyłączone w testach ze względu na niekompatybilność skryptów PostgreSQL z H2
spring.flyway.enabled=false

# Mail - mock dla testów
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@blokur.pl
spring.mail.password=test

# Katalog zapisu plików - dla testów używamy katalogu tymczasowego JVM
app.upload.dir=${java.io.tmpdir}/blokur-test-uploads

# JWT - statyczny sekret tylko dla testów
jwt.secret=TestSecretKeyForJwtTokensInUnitTestsOnly1234567890!
