version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: project
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: spring_backend
    restart: always
    ports:
      - "8080:8080"
      # Odkomentuj poniższe i ustaw SPRING_PROFILES_ACTIVE=prod, aby włączyć HTTPS na porcie 8443
      # - "8443:8443"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/project
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_FLYWAY_URL=jdbc:postgresql://db:5432/project
      - SPRING_FLYWAY_USER=admin
      - SPRING_FLYWAY_PASSWORD=admin
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      # Wymagane gdy SPRING_PROFILES_ACTIVE=prod:
      - SSL_KEYSTORE_PATH=${SSL_KEYSTORE_PATH:-}
      - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD:-}
      # Firebase Cloud Messaging — ustaw ścieżkę jeśli secrets/ zawiera klucz serwisowy:
      - FCM_CREDENTIALS_PATH=${FCM_CREDENTIALS_PATH:-}
    # Opcjonalne voluminki:
    # 1. Certyfikat SSL (tryb prod): utwórz ./certs, umieść keystore.p12 i odkomentuj:
    # volumes:
    #   - ./certs:/certs:ro
    # 2. Klucz serwisowy Firebase (FCM): utwórz ./backend/secrets/, wrzuć
    #    firebase-service-account.json i odkomentuj obie linie poniżej:
    # volumes:
    #   - ./backend/secrets:/app/secrets:ro


volumes:
  postgres_data:
